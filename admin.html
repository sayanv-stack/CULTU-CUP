<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel · CULTU CUP</title>
<style>
:root{--navy:#14235b;--navy-d:#0a1436;--navy-x:#060c22;--or:#c86b16;--or-l:#f0933a;--tx:#eef1fb;--mu:#9aa6d0;--ln:rgba(200,107,22,.35);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--navy-x);color:var(--tx);font:500 16px/1.45 system-ui,"Segoe UI",Arial,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--navy-d);border-bottom:2px solid var(--or)}header b{font-size:18px;letter-spacing:.04em}header span{margin-left:auto;color:var(--mu);font-size:14px}
main{max-width:1180px;margin:0 auto;padding:20px}h2,h4{margin:0 0 10px}
input,select,button{font:inherit;color:var(--tx)}input,select{width:100%;background:var(--navy-x);border:1px solid #2c3d7d;padding:9px 10px}
button{cursor:pointer;background:var(--or);border:0;padding:9px 16px;font-weight:700}button.alt{background:var(--navy);box-shadow:inset 0 0 0 1px var(--or)}button:disabled{opacity:.5;cursor:wait}
label{display:block;font-size:13px;font-weight:700;color:var(--mu);margin:8px 0 0}label>*{margin-top:4px;font-weight:500}
#login{max-width:380px;margin:60px auto;background:var(--navy);padding:24px;border-top:4px solid var(--or)}#login input{margin:6px 0}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--ln)}.tabs button{background:none;color:var(--mu);border-bottom:3px solid transparent;border-radius:0}.tabs button.on{color:#fff;border-color:var(--or)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:14px}
.fc{background:linear-gradient(160deg,var(--navy),var(--navy-d));border:1px solid var(--ln);border-top:4px solid var(--or);padding:14px}
.pv{height:150px;display:grid;place-items:center;background:var(--navy-x);border:1px dashed var(--or);color:var(--mu);overflow:hidden}.pv img{max-width:100%;max-height:100%;object-fit:contain}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bt{display:flex;gap:8px;margin-top:12px}
.lg{width:90px;height:90px;object-fit:contain;background:var(--navy-x);border:1px solid var(--ln);display:block;margin-bottom:6px}
#msg{min-height:24px;font-weight:700}.ok{color:#7be0a0}.err{color:#ff8a80}
#imp{background:var(--navy);border:1px solid var(--or);padding:14px;margin-bottom:16px}
</style>
</head>
<body>
<header><b>PANEL CULTU CUP</b><span id="who"></span><button class="alt" id="out" hidden>Salir</button></header>
<main>
<section id="login">
<h2>Iniciar sesión</h2>
<input id="em" type="email" autocomplete="username" placeholder="Correo">
<input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña">
<button id="go">Entrar</button>
<p id="lm" class="err"></p>
</section>
<section id="app" hidden>
<div id="imp" hidden><b>Todavía no hay datos guardados.</b> Puedes cargar de una vez los equipos y fichas que ya tiene la página.<br><br><button id="impBtn">Importar datos iniciales</button></div>
<nav class="tabs"><button data-t="tJ" class="on">Jugadores</button><button data-t="tT">Talento</button><button data-t="tE">Equipos</button></nav>
<div id="tJ"><label style="max-width:360px">Equipo<select id="selEq"></select></label><div id="gJ" class="grid"></div></div>
<div id="tT" hidden><div id="gT" class="grid"></div><p><button class="alt" id="addT">+ Agregar ficha de talento</button></p></div>
<div id="tE" hidden>
<p style="color:var(--mu)">Aquí solo se agregan equipos nuevos o se cambia el nombre o el logo de uno existente.</p>
<article class="fc" style="max-width:380px"><h4>Equipo nuevo</h4><label>Nombre<input id="neNom"></label><label>Logo (PNG sin fondo)<input id="neLogo" type="file" accept="image/*"></label><div class="bt"><button id="neGo">Agregar equipo</button></div></article>
<div id="lE" class="grid"></div>
</div>
<p id="msg" role="status"></p>
</section>
</main>
<datalist id="roles"><option>CASTER</option><option>ANALISTA</option><option>HOST</option><option>RUSHER</option><option>SOPORTE</option><option>GRANADERO</option><option>SNIPER</option></datalist>
<script>document.write('<script src="config.js?nc='+Date.now()+'"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const C=window.CFG||{},$=s=>document.querySelector(s);
if(!C.url||!C.key){document.body.innerHTML='<p style="padding:30px;max-width:560px">'+(window.CFG?'config.js se cargó pero la URL o la clave están vacías. Revisa que el archivo tenga la URL y la clave de Supabase entre comillas.':'El navegador no pudo cargar config.js. Revisa que el archivo esté en la misma carpeta que admin.html y abre esta página desde la dirección de tu sitio (https://...), no desde un archivo de tu computadora.')+'</p>';throw new Error("sin config")}
const sb=supabase.createClient(C.url,C.key);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PAISES=[["mx","México","Mexicano"],["co","Colombia","Colombiano"],["gt","Guatemala","Guatemalteco"],["ni","Nicaragua","Nicaragüense"],["do","República Dominicana","Dominicano"],["ve","Venezuela","Venezolano"],["br","Brasil","Brasileño"],["ar","Argentina","Argentino"],["cl","Chile","Chileno"],["pe","Perú","Peruano"],["ec","Ecuador","Ecuatoriano"],["bo","Bolivia","Boliviano"],["py","Paraguay","Paraguayo"],["uy","Uruguay","Uruguayo"],["cr","Costa Rica","Costarricense"],["pa","Panamá","Panameño"],["sv","El Salvador","Salvadoreño"],["hn","Honduras","Hondureño"],["cu","Cuba","Cubano"],["pr","Puerto Rico","Puertorriqueño"],["us","Estados Unidos","Estadounidense"],["es","España","Español"]];
const GENT=PAISES.map(p=>p[2]);
let EQ=[],FI=[];
const msg=(t,err)=>{const m=$("#msg");m.textContent=t;m.className=err?"err":"ok"};
// ---------- sesión ----------
async function entrar(ses){$("#login").hidden=true;$("#app").hidden=false;$("#out").hidden=false;$("#who").textContent=ses.user.email;await cargar()}
sb.auth.getSession().then(({data})=>{if(data.session)entrar(data.session)});
$("#go").onclick=async()=>{$("#lm").textContent="";const r=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(r.error)$("#lm").textContent="Correo o contraseña incorrectos.";else entrar(r.data.session)};
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click()});
$("#out").onclick=async()=>{await sb.auth.signOut();location.reload()};
// ---------- datos ----------
async function cargar(){const [e,f]=await Promise.all([sb.from("equipos").select("*").order("orden"),sb.from("fichas").select("*")]);
if(e.error||f.error){msg("No se pudieron leer los datos: "+(e.error||f.error).message,1);return}
EQ=e.data;FI=f.data;$("#imp").hidden=EQ.length>0;
const sel=$("#selEq"),cur=sel.value;sel.innerHTML=EQ.map(x=>`<option value="${esc(x.id)}">${esc(x.nombre)}</option>`).join("");if(cur)sel.value=cur;
pintaJ();pintaT();pintaE()}
const dato=(g,s)=>FI.find(x=>x.grupo===g&&x.slot===s);
function ficha(g,s,t,tal){t=t||{};return`<article class="fc" data-g="${esc(g)}" data-s="${s}" data-foto="${esc(t.foto||"")}"><h4>Ficha ${s}</h4>
<div class="pv">${t.foto?`<img src="${esc(t.foto)}" alt="">`:"<span>Sin foto</span>"}</div>
<label>Foto (PNG sin fondo)<input type="file" accept="image/*" class="f-foto"></label>
<label>${tal?"Nombre":"Jugador"}<input class="f-nombre" value="${esc(t.nombre||"")}"></label>
<label>País<select class="f-pais"><option value="">—</option>${PAISES.map(p=>`<option value="${p[0]}"${t.bandera===p[0]?" selected":""}>${p[1]}</option>`).join("")}</select></label>
<label>Nacionalidad (texto)<input class="f-nac" value="${esc(t.nacionalidad||"")}"></label>
<label>Rol<input class="f-rol" list="roles" value="${esc(t.rol||"")}"></label>
${tal?`<label>Instagram (enlace completo)<input class="f-ig" value="${esc(t.instagram||"")}" placeholder="https://www.instagram.com/..."></label>`:`<div class="two"><label>Partidas jugadas<input type="number" min="0" class="f-pj" value="${+t.partidas||0}"></label><label>Kills totales<input type="number" min="0" class="f-k" value="${+t.kills||0}"></label></div>`}
<div class="bt"><button class="save">Guardar</button><button class="alt clr">Vaciar</button></div></article>`}
function pintaJ(){const id=$("#selEq").value;$("#gJ").innerHTML=id?Array.from({length:6},(_,i)=>ficha(id,i+1,dato(id,i+1),0)).join(""):""}
function pintaT(){const mx=Math.max(6,...FI.filter(x=>x.grupo==="talento").map(x=>x.slot));$("#gT").innerHTML=Array.from({length:mx},(_,i)=>ficha("talento",i+1,dato("talento",i+1),1)).join("")}
$("#selEq").onchange=pintaJ;
$("#addT").onclick=()=>{const n=$("#gT").children.length+1;$("#gT").insertAdjacentHTML("beforeend",ficha("talento",n,null,1))};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));["tJ","tT","tE"].forEach(i=>$("#"+i).hidden=i!==b.dataset.t)});
// ---------- fotos ----------
async function procesar(file,maxDim,aspect){const bmp=await createImageBitmap(file);const c=document.createElement("canvas");c.width=bmp.width;c.height=bmp.height;const x=c.getContext("2d");x.drawImage(bmp,0,0);
const d=x.getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=0,y1=0,tr=false;
for(let y=0;y<c.height;y+=2)for(let xx=0;xx<c.width;xx+=2){const a=d[(y*c.width+xx)*4+3];if(a<250)tr=true;if(a>10){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y}}
if(!tr||x1<=x0){x0=0;y0=0;x1=c.width-1;y1=c.height-1}
const w=x1-x0+1;let h=y1-y0+1;if(aspect&&h>w/aspect)h=Math.round(w/aspect);
const sc=Math.min(1,maxDim/Math.max(w,h)),o=document.createElement("canvas");o.width=Math.max(1,Math.round(w*sc));o.height=Math.max(1,Math.round(h*sc));o.getContext("2d").drawImage(c,x0,y0,w,h,0,0,o.width,o.height);
return new Promise(r=>o.toBlob(r,"image/webp",.88))}
async function subir(path,blob){const r=await sb.storage.from("fotos").upload(path,blob,{contentType:blob.type||"image/webp",upsert:true});if(r.error)throw r.error;return sb.storage.from("fotos").getPublicUrl(path).data.publicUrl}
// ---------- fichas ----------
function eventos(root){root.addEventListener("change",e=>{const card=e.target.closest(".fc");if(!card)return;
if(e.target.classList.contains("f-foto")&&e.target.files[0]){card._file=e.target.files[0];card.querySelector(".pv").innerHTML=`<img src="${URL.createObjectURL(card._file)}" alt="">`}
if(e.target.classList.contains("f-pais")){const p=PAISES.find(x=>x[0]===e.target.value),n=card.querySelector(".f-nac");if(p&&(!n.value||GENT.includes(n.value)))n.value=p[2]}});
root.addEventListener("click",e=>{const card=e.target.closest(".fc");if(!card)return;if(e.target.classList.contains("save"))guardar(card);if(e.target.classList.contains("clr"))vaciar(card)})}
eventos($("#gJ"));eventos($("#gT"));
async function guardar(card){const g=card.dataset.g,s=+card.dataset.s,tal=g==="talento",q=x=>card.querySelector(x),b=q(".save");b.disabled=true;msg("Guardando…");
try{let foto=card.dataset.foto||null;if(card._file){foto=await subir(`${g}/${s}-${Date.now()}.webp`,await procesar(card._file,440,.85))}
const ig=tal?q(".f-ig").value.trim():"";if(ig&&!/^https?:\/\//.test(ig))throw new Error("El Instagram debe empezar con https://");
const row={grupo:g,slot:s,nombre:q(".f-nombre").value.trim()||null,bandera:q(".f-pais").value||null,nacionalidad:q(".f-nac").value.trim()||null,rol:q(".f-rol").value.trim().toUpperCase()||null,foto,instagram:ig||null,partidas:tal?0:+q(".f-pj").value||0,kills:tal?0:+q(".f-k").value||0};
const r=await sb.from("fichas").upsert(row,{onConflict:"grupo,slot"});if(r.error)throw r.error;
card.dataset.foto=foto||"";card._file=null;const i=FI.findIndex(x=>x.grupo===g&&x.slot===s);if(i<0)FI.push(row);else FI[i]=row;msg("Ficha guardada ✓")}
catch(e){msg("No se pudo guardar: "+(e.message||e),1)}finally{b.disabled=false}}
async function vaciar(card){if(!confirm("¿Vaciar esta ficha? Se borrarán sus datos y su foto."))return;const g=card.dataset.g,s=+card.dataset.s;
const r=await sb.from("fichas").delete().eq("grupo",g).eq("slot",s);if(r.error){msg("No se pudo vaciar: "+r.error.message,1);return}
FI=FI.filter(x=>!(x.grupo===g&&x.slot===s));card.outerHTML=ficha(g,s,null,g==="talento");msg("Ficha vaciada ✓")}
// ---------- equipos ----------
function pintaE(){$("#lE").innerHTML=EQ.map(e=>`<article class="fc" data-id="${esc(e.id)}"><img class="lg" src="${esc(e.logo||"")}" alt=""><label>Nombre<input class="e-nom" value="${esc(e.nombre)}"></label><label>Logo nuevo<input type="file" accept="image/*" class="e-logo"></label><div class="bt"><button class="e-save">Guardar</button></div></article>`).join("")}
$("#lE").addEventListener("click",async e=>{if(!e.target.classList.contains("e-save"))return;const c=e.target.closest(".fc"),id=c.dataset.id,f=c.querySelector(".e-logo").files[0];e.target.disabled=true;msg("Guardando…");
try{const up={nombre:c.querySelector(".e-nom").value.trim()};if(!up.nombre)throw new Error("Escribe el nombre");if(f)up.logo=await subir(`logos/${id}-${Date.now()}.webp`,await procesar(f,320,0));
const r=await sb.from("equipos").update(up).eq("id",id);if(r.error)throw r.error;msg("Equipo guardado ✓");await cargar()}catch(x){msg("No se pudo guardar: "+(x.message||x),1)}finally{e.target.disabled=false}});
$("#neGo").onclick=async()=>{const nom=$("#neNom").value.trim(),f=$("#neLogo").files[0];if(!nom||!f){msg("Escribe el nombre y elige el logo.",1);return}
const id=nom.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");if(EQ.some(x=>x.id===id)){msg("Ya existe un equipo con ese nombre.",1);return}
$("#neGo").disabled=true;msg("Agregando equipo…");
try{const logo=await subir(`logos/${id}-${Date.now()}.webp`,await procesar(f,320,0));const r=await sb.from("equipos").insert({id,nombre:nom,logo,orden:Math.max(0,...EQ.map(x=>x.orden||0))+1});if(r.error)throw r.error;
$("#neNom").value="";$("#neLogo").value="";msg("Equipo agregado ✓");await cargar()}catch(x){msg("No se pudo agregar: "+(x.message||x),1)}finally{$("#neGo").disabled=false}};
// ---------- importar datos iniciales ----------
$("#impBtn").onclick=async()=>{if(!confirm("Se cargarán los equipos y fichas actuales de la página. ¿Continuar?"))return;$("#impBtn").disabled=true;
try{const seed=await(await fetch("seed.json")).json();let n=0;const tot=seed.equipos.length+seed.fichas.length;
for(const e of seed.equipos){msg(`Importando… ${++n}/${tot}`);const blob=await(await fetch(e.logo)).blob(),url=await subir(`logos/${e.id}.${(blob.type.split("/")[1]||"webp")}`,blob);const r=await sb.from("equipos").insert({id:e.id,nombre:e.nombre,logo:url,orden:e.orden});if(r.error)throw r.error}
for(const f of seed.fichas){msg(`Importando… ${++n}/${tot}`);let foto=null;if(f.foto){const blob=await(await fetch(f.foto)).blob();foto=await subir(`${f.grupo}/${f.slot}-inicial.${(blob.type.split("/")[1]||"webp")}`,blob)}
const r=await sb.from("fichas").upsert({...f,foto},{onConflict:"grupo,slot"});if(r.error)throw r.error}
msg("Importación terminada ✓");await cargar()}catch(x){msg("Falló la importación: "+(x.message||x),1)}finally{$("#impBtn").disabled=false}};
</script>
</body>
</html>
